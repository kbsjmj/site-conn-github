# 소스 등록부. 추가·일시중지·퇴역은 이 파일에서만 한다.
# status: active | paused | retired
# keys: 환경변수 이름만 쓴다 (값은 쓰지 않는다). 하나라도 없으면 "키 없음".
# license: 재배포 조건 메모 (보고서 재배포 등급 판단에 사용)
sources:
  - id: fred
    adapter: fred
    kind: index
    mode: poll
    interval_min: 1440
    daily_limit: null          # 공식 한도 확인 후 기입
    keys: [FRED_API_KEY]
    realtime: daily
    status: active
    license: "FRED 약관 확인 필요 (생성 자료 재배포 조건)"
    series: [SP500, NASDAQCOM, DJIA, VIXCLS, DGS10, DCOILWTICO]   # 2026-11-10 추가: VIX, 미국 10년물, WTI (공식 FRED, 1~2영업일 지연). Local 등록부와 동일
    limit: 10
  - id: dart
    adapter: dart
    kind: disclosure
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [DART_API_KEY]
    realtime: near
    status: active
    license: "DART 이용약관 확인 필요 (출처 표기 조건)"
    lookback_days: 3
  - id: newsdata
    adapter: newsdata
    kind: news
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [NEWSDATA_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현
    license: "기사 원문 재배포 조건 확인 필요"
    poll_sec: 1800             # 무료 플랜 일 크레딧이 작아 10초 주기 금지
    keep_raw: false
    country: us,kr
    category: business
  - id: naver_news
    adapter: naver_news
    kind: news
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [NAVER_API_KEY_ID, NAVER_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현
    license: "네이버 검색 API 약관 확인 필요"
    poll_sec: 10               # 키워드를 poll마다 순환 (하루 약 8,640회)
    keep_raw: false
    display: 20
    queries: [증시, 코스피, 금리, 환율, 경제]
  - id: public_quote
    adapter: public_quote
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [DATA_GO_KR_KEY]
    realtime: daily
    status: paused             # 어댑터 미구현
    license: "공공누리 4유형: 상업적 이용·변경·재배포 금지"
  - id: ecos
    adapter: ecos
    kind: macro
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [ECOS_API_KEY]
    realtime: daily
    status: paused             # 키 미발급, 어댑터 미구현
    license: "한국은행 ECOS 이용 조건 확인 필요"
  - id: finnhub
    adapter: finnhub
    kind: quote
    mode: poll
    interval_min: 5
    daily_limit: null
    keys: [FINNHUB_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현
    license: "Finnhub 약관 확인 필요"
  - id: finnhub_news
    adapter: finnhub_news
    kind: news
    mode: poll
    interval_min: 1
    daily_limit: null
    keys: [FINNHUB_API_KEY]
    realtime: near
    status: paused             # 첫 run 확인 후 active. 무료 플랜 분당 60회
    license: "Finnhub 약관 확인 필요 (뉴스 원문 재배포 조건)"
    poll_sec: 10
    keep_raw: false
    category: general
  - id: tiingo
    adapter: tiingo
    kind: quote
    mode: poll
    interval_min: 60
    daily_limit: null
    keys: [TIINGO_API_KEY]
    realtime: daily
    status: paused             # 어댑터 미구현
    license: "Tiingo 약관 확인 필요"
  - id: kiwoom
    adapter: kiwoom
    kind: quote
    mode: ws
    interval_min: 1
    daily_limit: null
    keys: [KIWOOM_APP_KEY, KIWOOM_APP_SECRET]
    realtime: realtime
    status: paused             # 키 쌍 인증 대기, 어댑터 미구현
    license: "키움 약관 확인 필요 (계좌 기반)"
  # 웹훅 수신 전용. 시세 수집 소스가 아니다. 공개 주소와 서버가 생기기 전까지 paused.
  - id: tradingview
    adapter: tradingview
    kind: alert
    mode: push
    interval_min: null
    daily_limit: null
    keys: [TRADINGVIEW_WEBHOOK_SECRET]
    realtime: realtime
    status: paused             # 어댑터·수신 서버 미구현, 유료 플랜 확인 필요
    license: "TradingView 약관 확인 필요 (알림 수신용, 시세 재배포 아님)"

  # --- 2026-11-10 추가: Local 등록부(sources.yaml)에서 복사한 미등록 13곳. 모두 paused. 키 이름은 예정값.
  - id: alpha_vantage
    adapter: alpha_vantage
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [ALPHA_VANTAGE_API_KEY]
    realtime: delayed
    status: paused             # 어댑터 미구현 (접속 점검: 접속 가능)
    license: "Alpha Vantage 이용약관 확인 필요"
  - id: polygon
    adapter: polygon
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [POLYGON_API_KEY]
    realtime: delayed
    status: paused             # 어댑터 미구현 (접속 점검: 키 필요, 401)
    license: "Polygon.io 이용약관 확인 필요"
  - id: fmp
    adapter: fmp
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [FMP_API_KEY]
    realtime: delayed
    status: paused             # 어댑터 미구현 (접속 점검: 키 필요, 401)
    license: "FMP 이용약관 확인 필요"
  - id: yahoo_finance
    adapter: yahoo_finance
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: []
    realtime: delayed
    status: paused             # 비공식 엔드포인트. 약관 검토 전 사용 금지
    license: "공식 API 아님 (비공식 엔드포인트). 이용 조건 검토 전 수집 금지"
  - id: krx_open
    adapter: krx_open
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [KRX_API_KEY]
    realtime: daily
    status: paused             # 어댑터 미구현 (접속 점검: 접속 가능)
    license: "KRX 정보데이터시스템 OpenAPI 이용 조건 확인 필요"
  - id: krx_data
    adapter: krx_data
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: []
    realtime: daily
    status: paused             # 공식 API 여부 미확인 (웹 포털). 수집 방식 검토 전 사용 금지
    license: "공식 API 확인 전. 웹 포털 수집은 약관과 robots 확인 후에만 허용"
  - id: kis
    adapter: kis
    kind: quote
    mode: poll
    interval_min: 1
    daily_limit: null
    keys: [KIS_APP_KEY, KIS_APP_SECRET]
    realtime: realtime
    status: paused             # 어댑터 미구현 (접속 점검: 접속 가능, 키 미보유)
    license: "한국투자증권 Open API 약관 확인 필요 (계좌 기반)"
  - id: mirae_asset
    adapter: mirae_asset
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null
    keys: [MIRAE_ASSET_APP_KEY, MIRAE_ASSET_APP_SECRET]
    realtime: daily
    status: paused             # 공식 신청 경로 미확인 (접속 점검 당시 DNS 실패)
    license: "공식 신청 경로 미확인. 확인 전 사용 금지"
  - id: currents
    adapter: currents
    kind: news
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [CURRENTS_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현 (접속 점검: 키 필요, 401)
    license: "Currents API 약관 확인 필요 (기사 원문 재배포 조건)"
    poll_sec: 1800
    keep_raw: false
  - id: newsapi
    adapter: newsapi
    kind: news
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [NEWSAPI_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현 (접속 점검: 키 필요, 401)
    license: "NewsAPI.org 약관 확인 필요"
    poll_sec: 1800
    keep_raw: false
  - id: guardian
    adapter: guardian
    kind: news
    mode: poll
    interval_min: 10
    daily_limit: null
    keys: [GUARDIAN_API_KEY]
    realtime: near
    status: paused             # 어댑터 미구현 (접속 점검: 키 필요, 401)
    license: "The Guardian Open Platform 약관 확인 필요"
    poll_sec: 1800
    keep_raw: false
  - id: fsc_index
    adapter: fsc_index
    kind: index
    mode: poll
    interval_min: 1440
    daily_limit: null          # 개발계정 일 한도 활용신청 페이지에서 확인 후 기입
    keys: [DATA_GO_KR_KEY]
    realtime: daily
    status: paused             # 어댑터 미구현, 활용신청 승인 확인 필요
    license: "공공데이터포털 금융위원회 지수시세정보 이용 조건 확인 필요"
  - id: fsc_stock
    adapter: fsc_stock
    kind: quote
    mode: poll
    interval_min: 1440
    daily_limit: null          # 개발계정 트래픽 10,000 (페이지 표기)
    keys: [DATA_GO_KR_KEY]
    realtime: daily
    status: paused             # 어댑터 미구현, 활용신청 승인 확인 필요
    license: "공공데이터포털 금융위원회 주식시세정보 (이용허락 제한 없음, 페이지 표기)"
