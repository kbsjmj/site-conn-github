name: collect

# GitHub이 이 위치의 워크플로만 읽는다. 실제 코드는 모두 P2/에 있다.
on:
  schedule:
    - cron: '30 22 * * *'   # UTC 기준. 매일 07:30 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: P2
    env:
      SUPABASE_URL: https://byupfpdvyhabrbdsytnn.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - name: 수집
        run: python -m collectors.run
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
